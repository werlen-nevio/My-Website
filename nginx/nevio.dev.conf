# ============================================================
#  nevio.dev — Nginx config
#  Run certbot first, then switch to the HTTPS server block.
# ============================================================

# ── HTTP: redirect everything to HTTPS ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nevio.dev;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main site ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nevio.dev;

    # ── Document root ──────────────────────────────────────
    root /var/www/nevio.dev;
    index index.html;

    # ── SSL certificates (managed by Certbot) ──────────────
    ssl_certificate     /etc/letsencrypt/live/nevio.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevio.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    # ── Static asset caching ───────────────────────────────
    location ~* \.(css|js|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Main location ──────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Deny dotfiles ──────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
