# ============================================================
#  nevio.dev — Nginx config
#  Run certbot first, then switch to the HTTPS server block.
# ============================================================

# ── HTTP: redirect everything to HTTPS ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nevio.dev;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main site ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nevio.dev;

    # ── Document root ──────────────────────────────────────
    root /var/www/nevio.dev;

    # ── SSL certificates (managed by Certbot) ──────────────
    ssl_certificate     /etc/letsencrypt/live/nevio.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevio.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    # ── Code: revalidate via ETag (no manual cache-busting needed) ─
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # ── Assets: long cache, immutable ──────────────────────
    location ~* \.(woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Root: serve index.html directly (no internal redirect) ─
    location = / {
        try_files /index.html =404;
    }

    # ── Clean URLs ─────────────────────────────────────────
    # /index, /index.html → /
    location = /index      { return 301 /; }
    location = /index.html { return 301 /; }
    # /foo/index, /foo/index.html → /foo/
    location ~ ^(/.+/)index(\.html)?$ {
        return 301 $1;
    }
    # /foo.html → /foo
    location ~ ^(/.+)\.html$ {
        return 301 $1;
    }

    # ── Main location ──────────────────────────────────────
    # Try $uri, then $uri.html (clean URLs).
    location / {
        try_files $uri $uri.html =404;
    }

    # ── Deny dotfiles ──────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
