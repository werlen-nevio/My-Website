# ============================================================
#  nevio.dev — Nginx config
#  Serves the static Astro build (dist/) from /var/www/nevio.dev.
#  Run certbot first, then switch to the HTTPS server block.
# ============================================================

# ── HTTP: redirect everything to HTTPS ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nevio.dev;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main site ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nevio.dev;

    # ── Document root (contents of dist/) ──────────────────
    root /var/www/nevio.dev;

    # ── SSL certificates (managed by Certbot) ──────────────
    ssl_certificate     /etc/letsencrypt/live/nevio.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevio.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────
    # Note: nginx drops these when a location sets its own add_header,
    # so the asset locations below repeat the ones that matter for them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    # ── Custom 404 (internal, so the .html redirect below can't touch it)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Astro build assets: content-hashed file names → cache forever
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Screenshots & images: long cache ───────────────────
    location ~* \.(woff2?|ttf|otf|ico|svg|png|jpg|jpeg|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Root: serve index.html directly (no internal redirect) ─
    location = / {
        try_files /index.html =404;
    }

    # ── Clean URLs ─────────────────────────────────────────
    # /index, /index.html → /
    location = /index      { return 301 /; }
    location = /index.html { return 301 /; }
    # /foo/index, /foo/index.html → /foo
    location ~ ^(/.+/)index(\.html)?$ {
        return 301 $1;
    }
    # /foo.html → /foo
    location ~ ^(/.+)\.html$ {
        return 301 $1;
    }
    # /foo/ → /foo  (the build has no directory indexes)
    location ~ ^(/.+)/$ {
        return 301 $1;
    }

    # Removed case study (PYRA) → the project list
    location ~ ^/projects/pyra$    { return 301 /#projects; }
    location ~ ^/en/projects/pyra$ { return 301 /en#projects; }

    # ── Main location ──────────────────────────────────────
    # /en → en.html, /cv → cv.html, /projects/slopesafe → projects/slopesafe.html
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "SAMEORIGIN"                                  always;
        add_header X-Content-Type-Options     "nosniff"                                     always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;
        try_files $uri $uri.html =404;
    }

    # ── Deny dotfiles ──────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
